project:
  output-dir: _output
  # writes libs/ga-head.html: Google Analytics only when GA_ID is set in the render shell (README "Analytics")
  pre-render: libs/ga-head.ts
  resources:
    - libs/diagram.js
    - libs/diagram.css
    - libs/svg-pan-zoom.min.js
    - diagrams/*.svg
format:
  html:
    toc: true              # md to exclude: {.unnumbered .unlisted}
    toc-depth: 3
    toc-expand: 2
    number-sections: true  # md to exclude: {.unnumbered}
    number-depth: 3
    code-fold: show
    code-tools: true
    lightbox: true         # zoom figures; diagrams use the .cc-diagram viewer instead (.nolightbox)
    include-in-header:
      - libs/diagram-head.html
      - libs/ga-head.html  # written by the pre-render from GA_ID; no script when unset
date: now
date-format: "YYYY-MM-DD HH:mm:ss"
editor: source
editor_options: 
  chunk_output_type: console
